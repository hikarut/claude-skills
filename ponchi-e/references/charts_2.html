<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>資料で使う図解・グラフ 2/3</title>
<!-- ponchi-e の references/charts.md の見本。各図は SVG（viewBox 524×200）。色は theme.css の --main と base.html の変数（--tint〜--tint-5・--gray など）を使う -->
<link rel="stylesheet" href="../theme.css">
<style>  :root {
    --main-dark: color-mix(in srgb, var(--main) 76%, #000);    /* 強調テキスト */
    --tint: color-mix(in srgb, var(--main) 10%, #fff);         /* 本題エリアの淡い面 */
    --tint-2: color-mix(in srgb, var(--main) 5%, #fff);        /* さらに淡い面・帯矢印 */
    --tint-3: color-mix(in srgb, var(--main) 17%, #fff);       /* 淡い面より一段濃い面 */
    --tint-4: color-mix(in srgb, var(--main) 30%, #fff);       /* グラフの濃淡（中） */
    --tint-5: color-mix(in srgb, var(--main) 50%, #fff);       /* グラフの濃淡（濃）・主役に次ぐ要素 */
    --tint-line: color-mix(in srgb, var(--main) 12%, #d8d8d8); /* 淡い線 */
    --ink: #333;           /* 本文 */
    --sub: #777;           /* 補足・注記 */
    --gray-bg: #f0f0f0;    /* 補助パネル・前後工程の面 */
    --gray: #d9d9d9;       /* 補助の円・矢印 */
    --line: #c8c8c8;       /* 点線・細線 */
    --pill: #3a3a3a;       /* ラベル（ピル） */
    --r: 16px;             /* 角丸：面・カード・パネル */
    --r-sm: 8px;           /* 角丸：小さな箱・ラベル・見出し帯・画像枠 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1100px; background: #fff; font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", "Yu Gothic", sans-serif; color: var(--ink); padding: 36px 36px 40px; }
  h1 { font-size: 26px; font-weight: 800; color: #1a1a1a; display: flex; align-items: baseline; gap: 12px; }
  h1 .n { color: var(--main); }
  h1 .s { font-size: 22px; font-weight: 700; color: var(--sub); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 28px; margin-top: 26px; }
  .fig { background: #fff; border: 2px solid var(--gray-bg); border-radius: var(--r); height: 200px; }
  .fig svg { width: 100%; height: 100%; display: block; font-family: inherit; }
  .name { margin-top: 12px; display: flex; align-items: baseline; gap: 12px; font-size: 24px; font-weight: 800; color: #1a1a1a; }
  .name .no { font-size: 30px; font-weight: 500; color: var(--main); }
  .en { margin-top: 2px; font-size: 15px; color: var(--sub); }
</style></head>
