<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  /* メインカラー（--main）は theme.css で指定する。以下の濃淡はメインカラーから自動で作る */
  :root {
    --main-dark: color-mix(in srgb, var(--main) 76%, #000);    /* 強調テキスト */
    --tint: color-mix(in srgb, var(--main) 10%, #fff);         /* 本題エリアの淡い面 */
    --tint-2: color-mix(in srgb, var(--main) 5%, #fff);        /* さらに淡い面・帯矢印 */
    --tint-3: color-mix(in srgb, var(--main) 17%, #fff);       /* 淡い面より一段濃い面 */
    --tint-line: color-mix(in srgb, var(--main) 12%, #d8d8d8); /* 淡い線 */
    --ink: #333;           /* 本文 */
    --sub: #777;           /* 補足・注記 */
    --gray-bg: #f0f0f0;    /* 補助パネル・前後工程の面 */
    --gray: #d9d9d9;       /* 補助の円・矢印 */
    --line: #c8c8c8;       /* 点線・細線 */
    --pill: #3a3a3a;       /* ラベル（ピル） */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; background: #fff; overflow: hidden; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Meiryo", "Yu Gothic", sans-serif;
    color: var(--ink); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .slide { position: relative; width: 1280px; height: 720px; padding: 32px 48px 40px; display: flex; flex-direction: column; }

  /* ヘッダー（タイトル → キーメッセージ）：フォーマット固定 */
  .header { padding-left: 16px; color: #1a1a1a; }
  .title { font-size: 38px; font-weight: 800; line-height: 1.25; letter-spacing: -0.01em; }
  .key-message { margin-top: 8px; font-size: 20px; font-weight: 400; line-height: 1.45; }

  /* コンテンツ：1枚1メタファーの図を置く領域（position:relative なので絶対配置も可） */
  .content { position: relative; flex: 1; margin-top: 28px; min-height: 0; }

  /* テキスト */
  .em { color: var(--main); font-weight: 700; }                 /* 本文中の強調語 */
  .strong { font-weight: 700; }
  .small { font-size: 13px; color: var(--sub); }
  ul.dots { list-style: none; }
  ul.dots li { position: relative; padding-left: 1em; }
  ul.dots li::before { content: "・"; position: absolute; left: -0.1em; }

  /* ラベル */
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--pill); color: #fff; font-weight: 700; font-size: 15px; padding: 3px 18px; border-radius: 8px; white-space: nowrap; }
  .pill.main { background: var(--main); }
  .pill.pale { background: var(--tint); color: var(--ink); }
  .pill.round { border-radius: 999px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--gray-bg); border-radius: 6px; padding: 3px 10px; font-size: 14px; font-weight: 700; margin: 0 6px 6px 0; }  /* 補足のラベル（アイコン可） */
  .chip .icon { width: 18px; height: 18px; background: #666; }

  /* 面・枠 */
  .soft { background: var(--tint); border-radius: 20px; }        /* 本題エリア */
  .soft-gray { background: var(--gray-bg); }                     /* 補助パネル */
  .outline { background: #fff; border: 2px solid var(--main); text-align: center; }
  .ring { border: 2px solid #ececec; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .dashed-h { border-top: 2px dashed var(--line); }
  .dashed-v { border-left: 2px dashed #e0e0e0; }

  /* 円（放射図など） */
  .hub { border-radius: 50%; background: var(--main); color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; }
  .node { position: absolute; border-radius: 50%; background: var(--gray); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-align: center; line-height: 1.25; }

  /* 矢羽根（工程の見出し）：.chev = 本題、.chev.pale = 前工程、.chev.gray = 後工程 */
  .chev { display: flex; align-items: center; justify-content: center; height: 44px; padding-right: 14px; background: var(--main); color: #fff; font-weight: 800; font-size: 19px; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%); }
  .chev.pale { background: color-mix(in srgb, var(--main) 8%, #fff); color: var(--ink); }
  .chev.gray { background: var(--gray); color: var(--ink); }

  /* 期間バー：両端矢印付きの線の中央にピルを置く */
  .span { position: relative; display: flex; align-items: center; height: 26px; }
  .span::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; border-top: 2px solid currentColor; }
  .span::after { content: ""; position: absolute; right: 0; top: 50%; transform: translateY(-50%); border-left: 9px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .span .pill { position: relative; margin: 0 auto; font-size: 13px; padding: 1px 22px; }

  /* 太い帯の矢印（左から右への流れ） */
  .band-arrow { background: #f5f5f5; clip-path: polygon(0 0, calc(100% - 44px) 0, calc(100% - 44px) -30%, 100% 50%, calc(100% - 44px) 130%, calc(100% - 44px) 100%, 0 100%); display: flex; align-items: center; justify-content: center; gap: 14px; }

  /* 小さな矢印 */
  .arrow-r { width: 0; height: 0; border-left: 12px solid var(--gray); border-top: 16px solid transparent; border-bottom: 16px solid transparent; }
  .arrow-up { width: 2px; height: 32px; background: #888; position: relative; margin: 0 auto; }
  .arrow-up::before { content: ""; position: absolute; top: -8px; left: -6px; border-bottom: 9px solid #888; border-left: 7px solid transparent; border-right: 7px solid transparent; }
  .arrow-down { width: 2px; height: 28px; background: #666; position: relative; margin: 0 auto; }
  .arrow-down::after { content: ""; position: absolute; bottom: -8px; left: -6px; border-top: 9px solid #666; border-left: 7px solid transparent; border-right: 7px solid transparent; }

  /* アイコン（Lucide。既定はグレー、.main で紫）：<i class="icon" style="--i:url(https://unpkg.com/lucide-static@0.460.0/icons/users.svg)"></i> */
  .icon { display: inline-block; width: 30px; height: 30px; background: #555; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; flex: none; }
  .icon.main { background: var(--main); }
  .icon.w { background: #fff; }

  /* フッター */
  .source { position: absolute; left: 48px; bottom: 12px; font-size: 12px; color: var(--sub); }
  .page-info { position: absolute; right: 48px; bottom: 12px; font-size: 12px; color: var(--sub); }
  .page-info .no { margin-left: 16px; }
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <div class="title">{{スライドタイトル}}</div>
    <div class="key-message">{{キーメッセージ}}</div>
  </div>
  <div class="content">
    {{コンテンツ：examples/ のパターンを参考に組む}}
  </div>
  <div class="source">出所：{{出所}}</div>
  <div class="page-info">{{コピーライト}}<span class="no">{{ページ番号}}</span></div>
</div>
</body>
</html>
