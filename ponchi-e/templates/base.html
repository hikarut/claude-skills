<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  /* メインカラー（--main）は theme.css で指定する。以下の濃淡はメインカラーから自動で作る */
  :root {
    --main-dark: color-mix(in srgb, var(--main) 76%, #000);    /* 強調テキスト */
    --tint: color-mix(in srgb, var(--main) 10%, #fff);         /* 本題エリアの淡い面 */
    --tint-2: color-mix(in srgb, var(--main) 5%, #fff);        /* さらに淡い面・帯矢印 */
    --tint-3: color-mix(in srgb, var(--main) 17%, #fff);       /* 淡い面より一段濃い面 */
    --tint-4: color-mix(in srgb, var(--main) 30%, #fff);       /* グラフの濃淡（中） */
    --tint-5: color-mix(in srgb, var(--main) 50%, #fff);       /* グラフの濃淡（濃）・主役に次ぐ要素 */
    --tint-line: color-mix(in srgb, var(--main) 12%, #d8d8d8); /* 淡い線 */
    --ink: #333;           /* 本文 */
    --sub: #777;           /* 補足・注記 */
    --gray-bg: #f0f0f0;    /* 補助パネル・前後工程の面 */
    --gray: #d9d9d9;       /* 補助の円・矢印 */
    --line: #c8c8c8;       /* 点線・細線 */
    --pill: #3a3a3a;       /* ラベル（ピル） */
    --r: 16px;             /* 角丸：面・カード・パネル */
    --r-sm: 8px;           /* 角丸：小さな箱・ラベル・見出し帯・画像枠 */
    /* 余白の段階：外側ほど広く、内側ほど狭くする（パネルどうし > パネルの内側 > カードの内側 > カードどうし > 見出しと本文） */
    --gap-panel: 24px;     /* パネルどうしの間（矢印を挟む場合は矢印の幅） */
    --pad-panel: 24px;     /* パネルの内側の余白（上下左右とも） */
    --pad-card: 18px 24px; /* カードの内側の余白（上下・左右） */
    --gap-card: 14px;      /* パネル内のカードどうしの間 */
    --gap-text: 6px;       /* 見出しと本文の間 */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; background: #fff; overflow: hidden; }
  body {
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", "Meiryo", "Yu Gothic", sans-serif;
    color: var(--ink); font-size: 18px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .slide { position: relative; width: 1280px; height: 720px; padding: 34px 40px 38px; display: flex; flex-direction: column; }

  /* ヘッダー（タイトル → キーメッセージ）：フォーマット固定 */
  .header { padding: 0 8px; color: #1a1a1a; }
  .title { font-size: 40px; font-weight: 800; line-height: 1.25; letter-spacing: -0.01em; }
  .key-message { margin-top: 10px; font-size: 22px; font-weight: 400; line-height: 1.45; word-break: auto-phrase; }  /* <br> は入れず、右端まで使って文節の切れ目で自然に折り返す */

  /* コンテンツ：1枚1メタファーの図を置く領域（position:relative なので絶対配置も可） */
  .content { position: relative; flex: 1; margin-top: 30px; min-height: 0; }

  /* テキスト */
  .em { color: var(--main); font-weight: 700; }                 /* 本文中の強調語 */
  .key-message .em { white-space: nowrap; }                      /* キーメッセージの強調語は行をまたがせない */
  .strong { font-weight: 700; }
  .nw { white-space: nowrap; }                                   /* 途中で改行させたくない語句 */
  /* 数値：主役の数字は大きく、単位は数字の半分程度に下げる。<span class="num">954<small>%</small></span> */
  .num { font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; font-feature-settings: "palt"; }
  .num small { font-size: 0.5em; font-weight: 700; margin-left: 0.04em; letter-spacing: 0; }
  /* 人型の絵グラフ（charts.md の15）：<span class="people"><span class="person on"></span><span class="person"></span>…</span>。--w で幅 */
  .people { display: inline-flex; flex-wrap: wrap; gap: 8px; }
  .person { --w: 22px; width: var(--w); height: calc(var(--w) * 82 / 26); background: var(--gray); -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 82'><circle cx='13' cy='8' r='7.5'/><rect x='6' y='18' width='14' height='30' rx='5'/><rect x='0.5' y='19' width='4.5' height='25' rx='2.25'/><rect x='21' y='19' width='4.5' height='25' rx='2.25'/><rect x='6.5' y='42' width='6' height='40' rx='3'/><rect x='13.5' y='42' width='6' height='40' rx='3'/></svg>") center / contain no-repeat; mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 82'><circle cx='13' cy='8' r='7.5'/><rect x='6' y='18' width='14' height='30' rx='5'/><rect x='0.5' y='19' width='4.5' height='25' rx='2.25'/><rect x='21' y='19' width='4.5' height='25' rx='2.25'/><rect x='6.5' y='42' width='6' height='40' rx='3'/><rect x='13.5' y='42' width='6' height='40' rx='3'/></svg>") center / contain no-repeat; }
  .person.on { background: var(--main); }
  .num.xl { font-size: 60px; } .num.l { font-size: 48px; } .num.m { font-size: 34px; }
  .small { font-size: 16px; color: var(--sub); }
  ul.dots { list-style: none; }
  ul.dots li { position: relative; padding-left: 1em; }
  ul.dots li::before { content: "・"; position: absolute; left: -0.1em; }

  /* ラベル */
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--pill); color: #fff; font-weight: 700; font-size: 17px; padding: 3px 16px; border-radius: 8px; white-space: nowrap; }
  .pill.main { background: var(--main); }
  .pill.pale { background: var(--tint); color: var(--ink); }
  .pill.round { border-radius: 999px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--gray-bg); border-radius: var(--r-sm); padding: 3px 10px; font-size: 16px; font-weight: 700; margin: 0 6px 6px 0; }  /* 補足のラベル（アイコン可） */
  .chip .icon { width: 18px; height: 18px; background: #666; }

  /* 面・枠：角丸は --r（面）と --r-sm（小さな箱）の2種類に統一する */
  .soft { background: var(--tint); border-radius: var(--r); }        /* 本題エリア */
  .soft-gray { background: var(--gray-bg); border-radius: var(--r); }                     /* 補助パネル */
  /* パネルとカード：余白は上の変数で統一する。個別のスライドで padding や gap を書き換えない */
  .panel { display: flex; flex-direction: column; gap: var(--gap-card); padding: var(--pad-panel); }   /* .soft / .soft-gray と組み合わせる */
  .panel > .pill { align-self: flex-start; margin-bottom: 2px; font-size: 20px; padding: 4px 18px; }   /* パネルの見出しは大きく */
  .card { background: #fff; border-radius: var(--r-sm); padding: var(--pad-card); }
  .card.fill { flex: 1; display: flex; flex-direction: column; justify-content: center; }             /* 高さをそろえるときだけ使う。中身が少ないカードを引き伸ばさない */
  .card.fill.row { flex-direction: row; align-items: center; justify-content: flex-start; gap: 20px; }  /* 横並び（イラスト＋文字など） */
  .illust { display: block; height: 160px; width: auto; object-fit: contain; flex: none; }            /* unDraw のイラスト。高さ 120〜200px */
  .card .card-h { font-size: 22px; font-weight: 800; line-height: 1.3; }
  .card .card-t { font-size: 18px; line-height: 1.55; margin-top: var(--gap-text); }
  .outline { background: #fff; border: 2px solid var(--main); border-radius: var(--r-sm); text-align: center; }
  .ring { border: 2px solid #ececec; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .dashed-h { border-top: 2px dashed var(--line); }
  .dashed-v { border-left: 2px dashed #e0e0e0; }

  /* 円（放射図など） */
  .hub { border-radius: 50%; background: var(--main); color: #fff; display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 800; }
  .node { position: absolute; border-radius: 50%; background: var(--gray); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; text-align: center; line-height: 1.25; }

  /* 矢羽根（工程の見出し）：.chev = 本題、.chev.pale = 前工程、.chev.gray = 後工程 */
  .chev { display: flex; align-items: center; justify-content: center; height: 44px; padding-right: 14px; background: var(--main); color: #fff; font-weight: 800; font-size: 19px; clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 50%, calc(100% - 18px) 100%, 0 100%); }
  .chev.pale { background: color-mix(in srgb, var(--main) 8%, #fff); color: var(--ink); }
  .chev.gray { background: var(--gray); color: var(--ink); }

  /* 期間バー：両端矢印付きの線の中央にピルを置く */
  .span { position: relative; display: flex; align-items: center; height: 26px; }
  .span::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; border-top: 2px solid currentColor; }
  .span::after { content: ""; position: absolute; right: 0; top: 50%; transform: translateY(-50%); border-left: 9px solid currentColor; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
  .span .pill { position: relative; margin: 0 auto; font-size: 16px; padding: 1px 22px; }

  /* 太い帯の矢印（左から右への流れ） */
  .band-arrow { background: #f5f5f5; clip-path: polygon(0 0, calc(100% - 44px) 0, calc(100% - 44px) -30%, 100% 50%, calc(100% - 44px) 130%, calc(100% - 44px) 100%, 0 100%); display: flex; align-items: center; justify-content: center; gap: 14px; }

  /* 矢印（要素と要素を結ぶ）：<div class="link main"><span class="lab">ラベル</span><span class="ln"></span></div>
     結ぶ要素の中央の高さに置き、ラベルは矢印の真上に中央そろえ。--w で長さ */
  .link { position: relative; display: flex; align-items: center; justify-content: center; }       /* 線が要素の中央の高さに来る */
  .link .lab { position: absolute; left: 0; right: 0; bottom: calc(50% + 8px); font-size: 16px; font-weight: 700; color: var(--sub); text-align: center; line-height: 1.3; }
  .link .ln { position: relative; width: var(--w, 36px); height: 2px; background: #999; }
  .link .ln::after { content: ""; position: absolute; right: -2px; top: -6px; border-left: 11px solid #999; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
  .link.main .lab { color: var(--main); }
  .link.main .ln { background: var(--main); }
  .link.main .ln::after { border-left-color: var(--main); }

  /* 小さな矢印 */
  .arrow-r { width: 0; height: 0; border-left: 12px solid var(--gray); border-top: 16px solid transparent; border-bottom: 16px solid transparent; }
  .arrow-up { width: 2px; height: 32px; background: #888; position: relative; margin: 0 auto; }
  .arrow-up::before { content: ""; position: absolute; top: -8px; left: -6px; border-bottom: 9px solid #888; border-left: 7px solid transparent; border-right: 7px solid transparent; }
  .arrow-down { width: 2px; height: 28px; background: #666; position: relative; margin: 0 auto; }
  .arrow-down::after { content: ""; position: absolute; bottom: -8px; left: -6px; border-top: 9px solid #666; border-left: 7px solid transparent; border-right: 7px solid transparent; }

  /* アイコン（Lucide。既定はグレー、.main で紫）：<i class="icon" style="--i:url(https://unpkg.com/lucide-static@0.460.0/icons/users.svg)"></i> */
  .icon { display: inline-block; width: 30px; height: 30px; background: #555; -webkit-mask: var(--i) center / contain no-repeat; mask: var(--i) center / contain no-repeat; flex: none; }
  .icon.main { background: var(--main); }
  .icon.w { background: #fff; }
  /* アイコンの絵：淡色の円にアイコンを入れる。--s で大きさ（56〜96px）。主役だけ .main */
  .badge { --s: 72px; width: var(--s); height: var(--s); border-radius: 50%; background: var(--tint-3); display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .badge .icon { width: calc(var(--s) * 0.48); height: calc(var(--s) * 0.48); background: #444; }
  .badge.main { background: var(--main); }
  .badge.main .icon { background: #fff; }
  .badge.gray { background: var(--gray-bg); }   /* 白い面の上で使う */
  .badge.white { background: #fff; }            /* グレーの面（.soft-gray）の上で使う */

  /* フッター */
  .source { position: absolute; left: 40px; bottom: 10px; font-size: 13px; color: var(--sub); }
  .page-info { position: absolute; right: 40px; bottom: 10px; font-size: 13px; color: var(--sub); }
</style>
</head>
<body>
<div class="slide">
  <div class="header">
    <div class="title">{{スライドタイトル}}</div>
    <div class="key-message">{{キーメッセージ}}</div>
  </div>
  <div class="content">
    {{コンテンツ：examples/ のパターンを参考に組む}}
  </div>
  <div class="source">出所：{{出所}}</div>
  <div class="page-info">{{コピーライト}}</div>
</div>
</body>
</html>
